name: publish-pypi

# Two ways to release:
#   - push a tag `v<version>` (the version in pyproject.toml): builds, tests and publishes to PyPI;
#   - run the workflow by hand and choose the index, TestPyPI by default.
# Both publish with PyPI trusted publishing (OIDC), through the `pypi` or `testpypi` environment
# of this repository; no token is stored.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target package index'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Before anything is built: a release that would be refused fails in seconds.
  validate:
    name: Validate the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the index
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "repository=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${{ inputs.repository || 'testpypi' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the ref and the version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "Selected ref: ${{ github.ref }}; version in pyproject.toml: ${version}"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref_name }}" != "v${version}" ]; then
              echo "The tag ${{ github.ref_name }} does not match the version ${version} of pyproject.toml."
              exit 1
            fi
          elif [ "${{ steps.target.outputs.repository }}" = "pypi" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "A manual PyPI release is restricted to refs/heads/main."
            exit 1
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to ${{ needs.validate.outputs.repository }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.validate.outputs.repository }}
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Publish to TestPyPI
        if: needs.validate.outputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: needs.validate.outputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
