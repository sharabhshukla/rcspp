[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "rcspp"
version = "0.0.2.dev1"
description = "Resource Constrained Shortest Path Problem library with C++ and Python bindings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Laboratory for Combinatorial Optimization in Real-time Environment" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "networkx>=3,<4",
  # update_reduced_costs, arc rows and rcspp.pricing_pool import it.
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/lab-core/rcspp"
Repository = "https://github.com/lab-core/rcspp"
Issues = "https://github.com/lab-core/rcspp/issues"

[tool.scikit-build]
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
cmake.args = [
  "-DUSE_PYTHON=ON",
  "-DUSE_TESTS=OFF",
  "-DUSE_VRP=OFF",
]

[tool.cibuildwheel]
# The one place that says which wheels exist; the workflows set no CIBW_* selection of their own.
# cp314t is the free-threaded build. cibuildwheel >= 3.1 builds it without an `enable` entry; the
# extension does not declare itself safe without the GIL, so the interpreter turns the GIL back on
# when rcspp is imported there.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
# The quickstart of the docs, with its printed values asserted.
test-command = "python {project}/scripts/wheel_smoke_test.py"

[tool.cibuildwheel.linux]
# One wheel set per runner architecture: x86_64 on ubuntu-latest, aarch64 on ubuntu-24.04-arm.
archs = ["auto64"]
# manylinux_2_28 ships GCC 14 (gcc-toolset-14), which compiles the C++23 the library uses.
# before-all prints it, so a wheel log says which compiler built it.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "c++ --version && cmake --version"

[tool.cibuildwheel.macos]
# arm64 on macos-latest, x86_64 on an Intel runner; no universal2.
archs = ["native"]
before-all = "c++ --version && cmake --version"

[tool.cibuildwheel.macos.environment]
# 11.0 is the oldest macOS that runs on arm64. The library uses no libc++ feature that needs a
# newer system library; the compiler rejects the build if that changes.
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# No generator pin: CMake picks the newest Visual Studio, and the platform follows the target
# Python.

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = ".git,__pycache__,build,dist,venv"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["rcspp"]
